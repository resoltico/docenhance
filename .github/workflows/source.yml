name: Package source archive
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  attestations: write
  id-token: write
jobs:
  source:
    name: Deterministic source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned source-quality tools
        run: |
          python tools/install_build_tools.py
          python tools/install_build_tools.py --lint
      - name: Install pinned compiler and AST checker
        run: python tools/install_llvm.py --compiler
      - name: Required source gates
        run: python tools/check_all.py
      - name: Package deterministic source archive
        run: python tools/package_source.py
      - name: Attest source-archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/docenhance-*-source.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docenhance-source
          path: dist/*
          if-no-files-found: error
  publish:
    name: Publish changelog-bound source release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docenhance-source
          path: dist
      - name: Validate changelog-bound release notes
        run: python tools/publish_source_release.py --check
      - name: Publish and verify changelog-bound source release
        run: python tools/publish_source_release.py --assets-directory dist
        env:
          GH_TOKEN: ${{ github.token }}
