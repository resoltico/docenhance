name: Temporary source export for offline QA
on:
  push:
    branches: ['fix/nightly-oracle-advisory-evidence-20261011']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive exact head source
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/source.tar.gz" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-export-${{ github.sha }}
          path: ${{ runner.temp }}/source.tar.gz
          if-no-files-found: error
          retention-days: 1
