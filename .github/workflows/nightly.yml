name: Nightly deep checks
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time per target, in seconds
        default: '1800'
permissions:
  contents: read
concurrency:
  group: fuzz-campaign
  cancel-in-progress: false
jobs:
  sanitize:
    name: Sanitized / ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        preset: [sanitize, tsan]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python tools/install_build_tools.py
      - run: python tools/install_llvm.py --fuzzing
      - run: cmake -P cmake/AcquireDependencies.cmake
      - name: Build and test every suite with the selected sanitizer
        env:
          CC: clang-23
          CXX: clang++-23
        run: cmake --workflow --preset ${{ matrix.preset }}
  campaign:
    name: Campaign / ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: libfuzzer
            preset: fuzz
            cc: clang-23
            cxx: clang++-23
          - engine: afl
            preset: fuzz-afl
            cc: afl-clang-fast
            cxx: afl-clang-fast++
    runs-on: ubuntu-24.04
    # Covers the admitted manifest-derived campaign plus tool/dependency build headroom.
    timeout-minutes: 270
    env:
      SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '1800' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python tools/install_build_tools.py
      - run: python tools/install_llvm.py --fuzzing
      - name: Build pinned AFL++
        if: matrix.engine == 'afl'
        run: |
          python tools/install_aflplusplus.py
          echo core | sudo tee /proc/sys/kernel/core_pattern
      - name: Admit the complete workload before building
        run: python tools/run_fuzz_campaign.py --plan --seconds "$SECONDS_PER_TARGET" --jobs 2 --job-budget 14400
      - run: |
          python tools/deps.py fetch --dependency zlib
          python tools/deps.py fetch --dependency png
          python tools/deps.py fetch --dependency cli11
          python tools/deps.py fetch --dependency json
          python tools/deps.py fetch --dependency lcms
      - name: Build fuzzers
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake --preset ${{ matrix.preset }} -DDE_FUZZ_SECONDS="$SECONDS_PER_TARGET" -DDE_FUZZ_JOBS=2
          cmake --build --preset ${{ matrix.preset }}
      - name: Fuzz every CTest-registered target
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: Retain campaign evidence
        if: always()
        shell: bash
        run: |
          mkdir -p out/${{ matrix.preset }}/app/fuzz-work out/${{ matrix.preset }}/app/Testing/Temporary
          tar -czf out/${{ matrix.preset }}/fuzz-evidence.tar.gz -C out/${{ matrix.preset }}/app fuzz-work Testing/Temporary
      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: campaign-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/${{ matrix.preset }}/fuzz-evidence.tar.gz
          if-no-files-found: warn
          retention-days: 7
