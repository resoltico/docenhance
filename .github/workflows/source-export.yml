name: Source export
on:
  push:
    branches: [feat/typed-sauvola]
    paths: [.github/workflows/source-export.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'resoltico/docenhance' && github.ref == 'refs/heads/feat/typed-sauvola'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b2f93e1933b2580ac22732a955d06325775e9a35
          persist-credentials: false
      - name: Export exact reviewed base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b2f93e1933b2580ac22732a955d06325775e9a35
          test "$(git rev-parse HEAD^{tree})" = ee91438b0f3737421adb8f0e3c1e660474cd2d76
          mkdir export
          git archive --format=tar HEAD | gzip -n > export/source.tar.gz
          git ls-tree -rz HEAD > export/tree.bin
          git cat-file commit HEAD > export/commit.txt
          (cd export && sha256sum source.tar.gz tree.bin commit.txt > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docenhance-source
          path: export/
          retention-days: 1
          if-no-files-found: error
