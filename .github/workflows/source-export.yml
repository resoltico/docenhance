name: Source export
on:
  push:
    branches: [feat/cooperative-cancellation]
    paths: [.github/workflows/source-export.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'resoltico/docenhance'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9bc43220d8b562b431d2139a17fbd71cb8c111ae
          persist-credentials: false
      - name: Export verified source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9bc43220d8b562b431d2139a17fbd71cb8c111ae
          test "$(git rev-parse HEAD^{tree})" = 78ce91975c4c04b71b0c11dca8eb14a624870cc4
          mkdir export
          git archive --format=tar HEAD | gzip -n > export/source.tar.gz
          git ls-tree -rz HEAD > export/tree.bin
          git cat-file commit HEAD > export/commit.txt
          (cd export && sha256sum source.tar.gz tree.bin commit.txt > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docenhance-source
          path: export/
          if-no-files-found: error
          retention-days: 1
