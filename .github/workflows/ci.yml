name: Bounded paired timing diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: paired-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Seal one-shot payload and retain not-started record
        run: python packet/initialize.py
      - name: Assert actual macOS 15 Intel
        run: python tools/check_runtime_platform.py --platform macos-15-x86_64
      - name: Select pinned Xcode
        run: python tools/select_xcode.py
      - name: Install pinned schema validator without pip cache
        timeout-minutes: 3
        shell: python
        run: |
          import json, subprocess, sys
          from pathlib import Path
          pin = json.loads(Path('deps/tools.json').read_bytes())['jsonschema']
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--disable-pip-version-check',
                          '--only-binary=:all:', pin['package'] + '==' + pin['version']], check=True)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: e72a00f58303c01f31eea18c64745c93efbdabec
          path: sut-old
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: f577bf67cad6c433ea2a53cfaa4bc3294a2f8cb5
          path: sut-current
      - name: Restore exact qualified products and original evidence once
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packet/restore.py
      - name: Bind restored products, match host and admit one quiet timing window
        timeout-minutes: 13
        run: python packet/run_pair.py
      - name: Retain original restoration and pair evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paired-plain-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            restored-products/**
            packet/measurement/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
