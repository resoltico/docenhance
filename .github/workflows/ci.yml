name: Windows CMake generated-byte and error-counter diagnostic (not qualification)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pocketfft-byte-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  debug-configure:
    if: github.event_name == 'workflow_dispatch'
    name: Windows CMake byte and MSVC error-counter controls (not qualification)
    runs-on: windows-2025-vs2026
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: capsule
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: e42589c6e14bea5d347bbf856fa1b8dd6f55edee
          path: source
      - name: Normalize actual SUT Windows checkout
        shell: pwsh
        working-directory: source
        run: |
          git config --local core.autocrlf false
          git reset --hard
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python tools/install_build_tools.py
        working-directory: source
      - name: Select actual MSVC and run finite byte and error-counter controls
        shell: pwsh
        env:
          DE_BUILD_JOBS: '2'
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'A current Visual Studio C++ toolchain is required' }
          $devshell = Join-Path $installation 'Common7\Tools\Launch-VsDevShell.ps1'
          & $devshell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw 'MSVC developer environment was not activated' }
          python capsule/packet/diagnose.py --source source --output byte-counter-evidence
          exit $LASTEXITCODE
      - name: Retain only bounded original preflight logs and identity receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pocketfft-bytes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            byte-counter-evidence/*.json
            byte-counter-evidence/*.log
            byte-counter-evidence/*-generated.h
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
