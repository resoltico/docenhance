name: Original196 two-case phase diagnostic (not qualification)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: constructor-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  debug-configure:
    if: github.event_name == 'workflow_dispatch'
    name: Finite MSVC derived-constructor and CLIENT delete controls (not qualification)
    runs-on: windows-2025-vs2026
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: capsule
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: a12a0fdd5ba5a508c8d604685546d34f6e0f876d
          path: source
      - name: Normalize actual SUT Windows checkout
        shell: pwsh
        working-directory: source
        run: |
          git config --local core.autocrlf false
          git reset --hard
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Select actual MSVC and run one finite constructor probe
        shell: pwsh
        env:
          DE_BUILD_JOBS: '2'
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'A current Visual Studio C++ toolchain is required' }
          $devshell = Join-Path $installation 'Common7\Tools\Launch-VsDevShell.ps1'
          & $devshell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw 'MSVC developer environment was not activated' }
          python capsule/packet/diagnose.py --source source --output constructor-evidence
          exit $LASTEXITCODE
      - name: Retain only bounded original preflight logs and identity receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: constructor-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            constructor-evidence/*.json
            constructor-evidence/*.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
