name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  structural:
    name: Structural and reference gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python tools/install_build_tools.py
      - run: python tools/install_build_tools.py --lint
      - run: python tools/install_llvm.py --compiler
      - run: python tools/check_all.py
      - run: python tools/check_reference_suite.py --compiler g++
      - run: python tools/check_reference_suite.py --compiler clang++-23 --sanitize
  native:
    name: Native / ${{ matrix.platform }}
    needs: structural
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos-arm64
            os: macos-26
          - platform: macos-x86_64
            os: macos-26-intel
          - platform: windows-x86_64
            os: windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    # The hosted Intel macOS runner builds the pinned LLVM 23 analysis tools from source.
    # Leave enough room for the subsequent native validation on a cache miss.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Normalize Windows checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git reset --hard
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Restore pinned Intel LLVM tools
        id: intel-llvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.platform == 'macos-x86_64'
        with:
          path: ~/.cache/docenhance/llvm
          # A generation never receives a partial post-cancellation cache entry.
          key: llvm-source-${{ runner.arch }}-${{ hashFiles('deps/tools.json', 'tools/install_llvm.py') }}
      - run: python tools/install_build_tools.py
      - run: python tools/install_llvm.py
      - name: Save verified Intel LLVM tools
        if: matrix.platform == 'macos-x86_64' && steps.intel-llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/docenhance/llvm
          key: llvm-source-${{ runner.arch }}-${{ hashFiles('deps/tools.json', 'tools/install_llvm.py') }}
      - run: cmake -P cmake/AcquireDependencies.cmake
      # A hosted runner has cores the default of two workers leaves idle. Each job states how many
      # it has, and that one count bounds every external build and the architecture check.
      - name: Give the native builds the runner's cores
        shell: python
        run: |
          import os
          import sys
          sys.path.insert(0, "tools")
          from parallel import available_jobs
          cores = available_jobs()
          print(f"The runner reports {cores} logical cores")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"DE_BUILD_JOBS={cores}\n")
      - name: Build, test and package
        if: runner.os != 'Windows'
        run: cmake --workflow --preset release
      - name: Smoke-test the package without publishing it
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          packages=(dist/*.tar.gz)
          test "${#packages[@]}" = 1
          python tools/package_smoke.py "${packages[0]}" --build out/release/app
      - name: Build, test and package with MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci_windows.ps1
  fuzz:
    name: Strict fuzzing / ${{ matrix.engine }} (ASan + UBSan)
    needs: structural
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: libfuzzer
            preset: fuzz
            cc: clang-23
            cxx: clang++-23
          - engine: afl
            preset: fuzz-afl
            cc: afl-clang-fast
            cxx: afl-clang-fast++
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python tools/install_build_tools.py
      - run: python tools/install_llvm.py --fuzzing
      - run: python tools/run_fuzz_campaign.py --plan --seconds 60 --jobs 2 --job-budget 2100
      - name: Build pinned AFL++
        if: matrix.engine == 'afl'
        run: |
          python tools/install_aflplusplus.py
          echo core | sudo tee /proc/sys/kernel/core_pattern
      - run: |
          python tools/deps.py fetch
      - name: Build and fuzz every target (60 s each)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Retain fuzz evidence
        if: always()
        shell: bash
        run: |
          mkdir -p out/${{ matrix.preset }}/app/fuzz-work out/${{ matrix.preset }}/app/Testing/Temporary
          tar -czf out/${{ matrix.preset }}/fuzz-evidence.tar.gz -C out/${{ matrix.preset }}/app fuzz-work Testing/Temporary
      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/${{ matrix.preset }}/fuzz-evidence.tar.gz
          if-no-files-found: warn
          retention-days: 7
  sanitize:
    name: Sanitized / ${{ matrix.preset }}
    needs: structural
    strategy:
      fail-fast: false
      matrix:
        preset: [sanitize, tsan]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python tools/install_build_tools.py
      - run: python tools/install_llvm.py --fuzzing
      - run: cmake -P cmake/AcquireDependencies.cmake
      - name: Give the sanitized builds the runner's cores
        shell: python
        run: |
          import os
          import sys
          sys.path.insert(0, "tools")
          from parallel import available_jobs
          cores = available_jobs()
          print(f"The runner reports {cores} logical cores")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"DE_BUILD_JOBS={cores}\n")
      - name: Build and test every suite with the selected sanitizer
        env:
          CC: clang-23
          CXX: clang++-23
        run: cmake --workflow --preset ${{ matrix.preset }}
  gate:
    name: Required quality gate
    if: always()
    needs: [structural, native, fuzz, sanitize]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every build and test job
        shell: bash
        env:
          STRUCTURAL_RESULT: ${{ needs.structural.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          SANITIZE_RESULT: ${{ needs.sanitize.result }}
        run: |
          test "$STRUCTURAL_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$FUZZ_RESULT" = success
          test "$SANITIZE_RESULT" = success
