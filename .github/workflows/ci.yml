name: Bounded paired timing diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paired-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired:
    runs-on: macos-15-intel
    timeout-minutes: 125
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
      DE_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Seal one-shot payload and retain not-started bootstrap record
        run: python packet/initialize.py
      - name: Assert actual macOS 15 Intel
        run: python tools/check_runtime_platform.py --platform macos-15-x86_64
      - name: Select pinned Xcode
        run: python tools/select_xcode.py
      - name: Identify exact Intel LLVM cache environment
        id: intel-llvm-environment
        shell: python
        run: |
          import hashlib
          import json
          import os
          import platform
          identity = {
              "host_os_version": platform.mac_ver()[0],
              "developer_directory": os.environ.get("DEVELOPER_DIR", "system-default"),
          }
          digest = hashlib.sha256(json.dumps(identity, sort_keys=True).encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"identity={digest}\n")
      - name: Restore existing pinned Intel analysis tools
        id: intel-llvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/docenhance/llvm
          key: llvm-source-macos-15-intel-${{ runner.arch }}-${{ steps.intel-llvm-environment.outputs.identity }}-${{ hashFiles('deps/tools.json', 'tools/install_llvm.py', 'tools/llvm_cache.py') }}
      - name: Refuse a missing LLVM cache
        if: steps.intel-llvm-cache.outputs.cache-hit != 'true'
        run: python -c 'raise SystemExit("Exact LLVM cache absent; no cold LLVM build or ambient substitution")'
      - name: Install pinned build and schema tools without pip cache
        timeout-minutes: 3
        run: python tools/install_build_tools.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: e72a00f58303c01f31eea18c64745c93efbdabec
          path: sut-old
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: f577bf67cad6c433ea2a53cfaa4bc3294a2f8cb5
          path: sut-current
      - name: Verify tools and build both exact products within one owner
        run: python packet/produce.py
      - name: Admit one fresh quiet window and run four fixed slots
        timeout-minutes: 13
        run: python packet/run_pair.py
      - name: Retain original producer and pair evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paired-plain-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            performance-work/evidence/**
            performance-work/results.json
            performance-work/progress.json
            performance-work/tmp/metadata-current.log
            packet/measurement/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
