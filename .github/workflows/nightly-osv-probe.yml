name: Temporary OSV evidence probe (remove before PR)
on:
  push:
    branches: ['fix/nightly-oracle-advisory-evidence-20261011']
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python tools/deps.py fetch
      - name: Print normalized JPEG advisory evidence fingerprint (no tokens)
        run: |
          python - <<'PY'
          import hashlib
          import json
          import sys
          sys.path.insert(0, "tools")
          from check_advisories import matches, source_query
          from deps import ROOT, load_lock
          dependency = next(d for d in load_lock(ROOT / "deps/lock.json")["dependencies"] if d["name"] == "jpeg")
          result = matches(source_query(dependency, ROOT / ".cache/deps"))
          for advisory in result:
              if advisory["id"] == "OSV-2026-1068":
                  evidence = {key: val for key, val in advisory.items() if key != "modified"}
                  canonical = json.dumps(evidence, sort_keys=True, separators=(",", ":"))
                  print("OBSERVED_ID", advisory["id"], flush=True)
                  print("OBSERVED_SHA256", hashlib.sha256(canonical.encode()).hexdigest(), flush=True)
                  print("OBSERVED_JSON", json.dumps(advisory, sort_keys=True), flush=True)
          PY
