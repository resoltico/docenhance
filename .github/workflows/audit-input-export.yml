# Temporary verification-input acquisition; removed before review.
name: Audit input export
on:
  push:
    branches: [audit/architecture-foundations]
    paths: [.github/workflows/audit-input-export.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'resoltico/docenhance'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4f65f823b52ac84dac320461bc392b1bda4fd70d
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Acquire LLVM 23 for the offline Debian verification environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4f65f823b52ac84dac320461bc392b1bda4fd70d
          mkdir -p export/debs export/wheels
          curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key > export/llvm.asc
          fingerprint=$(gpg --show-keys --with-colons export/llvm.asc | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          gpg --batch --dearmor -o export/llvm.gpg export/llvm.asc
          sudo install -m 0644 export/llvm.gpg /usr/share/keyrings/docenhance-audit-llvm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/docenhance-audit-llvm.gpg] https://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-23 main' | sudo tee /etc/apt/sources.list.d/docenhance-audit-llvm.list
          sudo apt-get update
          (cd export/debs && apt-get download clang-23 clang-tidy-23 clang-tools-23 libclang-common-23-dev libclang-rt-23-dev libclang1-23 libclang-cpp23 libllvm23 llvm-23-linker-tools)
          python -m pip download --only-binary=:all: -d export/wheels types-jsonschema==4.26.0.20260518
          printf '%s\n' 4f65f823b52ac84dac320461bc392b1bda4fd70d > export/SOURCE_COMMIT
          (cd export && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docenhance-audit-llvm
          path: export/
          if-no-files-found: error
          retention-days: 1
