# Temporary exact-byte transfer. Removed by the connected GitHub publication action.
name: Audit publication transfer
on:
  push:
    branches: [audit/architecture-foundations]
    paths: [.github/workflows/audit-input-export.yml]
permissions:
  contents: read
concurrency:
  group: audit-publication-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'resoltico/docenhance' && github.ref == 'refs/heads/audit/architecture-foundations' && github.event.before == '0394d9d48b0923f80a6c3a3f1aa989a1ded3402c'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify and publish only the reviewed feature-branch code
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, lzma, os, pathlib, subprocess
          BASE = '4f65f823b52ac84dac320461bc392b1bda4fd70d'
          BASE_TREE = '3ed643c2349edfee72a4458f2e55b550e247043c'
          PARENT = '0394d9d48b0923f80a6c3a3f1aa989a1ded3402c'
          TARGET = '98d90f5f9c0fb6bc410524c6b4b6d5530a67ff8c'
          PACKED = 'dcfcb3c60d224753c98c6870a05f2881e686c646c15e1cd3ba49f4cd523b6f07'
          BRANCH = 'refs/heads/audit/architecture-foundations'
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data)
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          head = git('rev-parse', 'HEAD').decode().strip()
          require(head == os.environ['GITHUB_SHA'], 'Unexpected checkout identity')
          require(os.environ['GITHUB_REF'] == BRANCH, 'Unexpected branch')
          require(git('rev-parse', head + '^').decode().strip() == PARENT, 'Concurrent preparation change')
          require(git('rev-parse', BASE + '^{tree}').decode().strip() == BASE_TREE, 'Unexpected source tree')
          subprocess.run(['git', 'merge-base', '--is-ancestor', BASE, head], check=True)
          parts = [f'.github/audit-transfer/part-{i:02}' for i in range(5)]
          packed = b''.join(pathlib.Path(p).read_bytes() for p in parts)
          require(hashlib.sha256(packed).hexdigest() == PACKED, 'Transfer checksum mismatch')
          payload = json.loads(lzma.decompress(packed))
          require((payload['base_commit'], payload['base_tree'], payload['target_tree']) == (BASE, BASE_TREE, TARGET), 'Unexpected transfer identities')
          original = {}
          for record in git('ls-tree', '-rz', BASE).split(b'\0'):
              if record:
                  metadata, name = record.split(b'\t', 1)
                  original[name.decode()] = metadata.decode().split()[2]
          index = pathlib.Path(os.environ['RUNNER_TEMP']) / 'docenhance-audit-index'
          require(not index.exists(), 'Refusing to reuse an index')
          os.environ['GIT_INDEX_FILE'] = str(index)
          git('read-tree', BASE_TREE)
          seen = set()
          for entry in payload['entries']:
              path = entry['path']
              require(path not in seen and not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts and '.git' not in pathlib.PurePosixPath(path).parts, 'Invalid transfer path')
              seen.add(path)
              require(original.get(path) == entry['before'], 'Base blob mismatch: ' + path)
              if entry.get('delete'):
                  git('update-index', '--force-remove', '--', path)
                  continue
              lines = git('cat-file', 'blob', entry['before']).decode().splitlines(keepends=True) if entry['before'] else []
              for start, end, replacement in reversed(entry['edits']):
                  require(0 <= start <= end <= len(lines), 'Invalid edit extent')
                  lines[start:end] = replacement.splitlines(keepends=True)
              content = ''.join(lines).encode()
              blob = git('hash-object', '-w', '--stdin', data=content).decode().strip()
              require(blob == entry['blob'], 'Changed blob mismatch: ' + path)
              require(entry['mode'] in ('100644', '100755'), 'Unexpected file mode')
              git('update-index', '--add', '--cacheinfo', f"{entry['mode']},{blob},{path}")
          require(git('write-tree').decode().strip() == TARGET, 'Final Git tree mismatch')
          print('VERIFIED_SUBMITTED_TREE=' + TARGET)
          # The runner token publishes code only. Connected GitHub actions finalize workflow
          # changes and remove transfer infrastructure, so no workflow-write token is needed.
          retained = ['.github/workflows/ci.yml', '.github/workflows/nightly.yml', '.github/workflows/audit-input-export.yml', *parts]
          for path in retained:
              metadata, name = git('ls-tree', head, '--', path).rstrip(b'\n').split(b'\t', 1)
              mode, kind, blob = metadata.decode().split()
              require(kind == 'blob' and name.decode() == path, 'Unexpected retained entry')
              git('update-index', '--add', '--cacheinfo', f'{mode},{blob},{path}')
          transfer_tree = git('write-tree').decode().strip()
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          commit = git('commit-tree', transfer_tree, '-p', head, data=b'refactor: repair architecture and runtime foundations\n\nVerified exact-byte transfer; workflow enforcement and cleanup follow through connected GitHub actions.\n').decode().strip()
          remote = git('ls-remote', 'origin', BRANCH).decode().split()[0]
          require(remote == head, 'Concurrent remote change; refusing publication')
          subprocess.run(['git', 'push', 'origin', f'{commit}:{BRANCH}'], check=True)
          require(git('ls-remote', 'origin', BRANCH).decode().split()[0] == commit, 'Remote readback mismatch')
          print('TRANSFER_COMMIT=' + commit)
          print('TRANSFER_TREE=' + transfer_tree)
          PY
